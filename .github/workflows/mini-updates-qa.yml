name: Mini updates isolated QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa
          POSTGRES_DB: kekip_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://qa:qa@127.0.0.1:5432/kekip_qa
      KEKIP_ADMIN_USERNAMES: qa_admin
      KEKIP_ADMIN_KEY: qa-isolated-test-key-not-a-production-secret
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/mini-updates-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-arcade-visual-review
          path: qa-neon/
          if-no-files-found: warn
          retention-days: 14
