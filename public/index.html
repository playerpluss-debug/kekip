<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KEKIP - Arkadaşlarınla Oyna</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #171329;
      color: white;
      display: grid;
      place-items: center;
      text-align: center;
    }
    main { padding: 30px; }
    h1 { font-size: 64px; color: #b99aff; }
    p { color: #c9c3dc; font-size: 18px; }
    button {
      padding: 15px 25px;
      margin: 10px;
      border: 0;
      border-radius: 12px;
      background: #9870f5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>🐱 KEKIP</h1>
    <p>Arkadaşlarınla oyun keyfi burada başlıyor!</p>
    <button onclick="alert('Oda oluşturma yakında!')">Oda Oluştur</button>
    <button onclick="alert('Odaya katılma yakında!')">Odaya Katıl</button>
  </main>
</body>
</html>
