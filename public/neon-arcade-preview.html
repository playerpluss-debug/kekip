<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Arcade · Koleksiyon incelemesi</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#181123;color:#f4eaff;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:20px}a{color:#dfc8ff}h1{margin:12px 0 6px}p{color:#cdbce3}[hidden]{display:none!important}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;color:inherit;background:#33234d;border:1px solid #76599c;border-radius:9px;padding:9px 12px}button[aria-pressed=true]{background:#7646b8;border-color:#d9baff}button:disabled{opacity:.5}.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.panel{border:1px solid #59446f;border-radius:16px;background:#21172e;padding:14px;min-width:0}.panel h2{font-size:14px;margin:0 0 12px;color:#dfccf9}.stage{display:grid;place-items:center;background:repeating-conic-gradient(#30243e 0% 25%,#281d35 0% 50%) 50%/24px 24px;border-radius:10px;min-height:220px;overflow:hidden}.stage img{display:block;width:100%;max-width:480px;height:auto;object-fit:contain}.layer-stage{aspect-ratio:480/660}.layer-stage img{max-width:100%;max-height:430px;width:min(100%,360px);height:auto;object-fit:contain}.muted{font-size:12px}.price{color:#f5d78c;font-weight:700}.rarity{color:#d8b8ff}.worker{position:absolute;width:480px;height:660px;left:-10000px;top:0;border:0}.nav{display:flex;gap:10px;justify-content:space-between;align-items:center}.embed main{padding:4px}.embed #back,.embed h1,.embed #meta,.embed .toolbar,.embed .nav,.embed #note,.embed #detailPanel,.embed #avatarHeading{display:none}.embed .panels{display:block}.embed .panel{padding:0;border:0;background:transparent}.embed .stage{min-height:0;background:transparent}.embed .stage img{max-width:240px}@media(max-width:650px){main{padding:12px}.panels{grid-template-columns:1fr}.stage img{max-width:360px}.layer-stage{aspect-ratio:auto;min-height:220px}.layer-stage img{max-height:340px}}
</style><script src="/neon-arcade-art.js?v=1"></script></head><body><main><a id="back" href="/shop.html">← Mağazaya dön</a><h1 id="name">Neon Arcade</h1><p id="meta"></p><div class="toolbar"><label>Ürün <select id="products"></select></label><button id="single" aria-pressed="true">Tek ürün</button><button id="full" aria-pressed="false">Tam koleksiyon</button><button id="base" aria-pressed="false">Başlangıç görünümü</button></div><p id="status" role="status">Karakter hazırlanıyor…</p><div class="panels"><section class="panel" id="detailPanel"><h2>Gerçek ürün katmanları</h2><div class="stage layer-stage"><img id="detail" hidden alt="Ürün katmanları"></div><p id="detailStatus" class="muted" role="status"></p></section><section class="panel"><h2 id="avatarHeading">Karakter üzerinde · 480 × 660</h2><div class="stage"><img id="avatar" hidden alt="Seçili ürün karakter üzerinde"></div></section></div><div class="toolbar nav"><button id="prev">‹ Önceki</button><span id="position"></span><button id="next">Sonraki ›</button></div><p id="note">Neon Arcade · Ücretsiz önizleme. Hesabındaki kombin veya KC bakiyesi değişmez.</p></main><script>
(()=>{'use strict';const q=new URLSearchParams(location.search),$=id=>document.getElementById(id),items=window.KPNeonArt.items,initial=items.find(x=>x.id===q.get('item')),defaults={"gece":{"character":"gece","items":{"av_hair":"gece_hair_double","av_eye":"gece_eye_original","av_brow":"gece_brow_original","av_expression":"gece_mouth_original","av_top":"gece_top_heart","av_bottom":"gece_bottom_cargo","av_shoes":"gece_shoe_classic","av_ear":null,"av_wrist":null},"hairColor":"original","eyeColor":"gold","expressionBrows":true},"golge":{"character":"golge","items":{"av_hair":"golge_hair_original","av_eye":"golge_eyes_original","av_brow":"golge_eyebrows_original","av_expression":"golge_expression_original","av_top":"golge_top_default","av_bottom":"golge_bottom_default","av_shoes":"golge_shoes_default","av_ear":null,"av_wrist":null,"av_neck":null,"av_glasses":null},"hairColor":"original","eyeColor":"gold","expressionBrows":true}};if(q.has('embed'))document.body.classList.add('embed');if(!initial){$('status').textContent='Ürün bulunamadı.';return}let item=initial,mode='single',frame=null,serial=0,timer;for(const i of items){const opt=document.createElement('option');opt.value=i.id;opt.textContent=(i.character==='gece'?'Gece':'Gölge')+' · '+i.name;$('products').append(opt)}
const load=src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src});
async function detail(i,epoch){$('detail').hidden=true;$('detailStatus').textContent='Katmanlar yükleniyor…';try{const layers=Object.values(i.layers),images=await Promise.all(layers.map(l=>load(l.hd||l.standard)));const cv=document.createElement('canvas');cv.width=960;cv.height=1320;const ctx=cv.getContext('2d');const order=Object.keys(i.layers);const sorted=images.map((im,n)=>({im,k:order[n]})).sort((a,b)=>Number(!a.k.endsWith('-back'))-Number(!b.k.endsWith('-back')));for(const {im} of sorted)ctx.drawImage(im,0,0,960,1320);const px=ctx.getImageData(0,0,960,1320).data;let x0=960,y0=1320,x1=-1,y1=-1;for(let y=0;y<1320;y++)for(let x=0;x<960;x++)if(px[(y*960+x)*4+3]>16){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}if(x1<0)throw Error('Boş katman');const pad=20,w=x1-x0+1,h=y1-y0+1,out=document.createElement('canvas');out.width=w+pad*2;out.height=h+pad*2;out.getContext('2d').drawImage(cv,x0,y0,w,h,pad,pad,w,h);if(epoch!==serial)return;$('detail').src=out.toDataURL('image/png');await $('detail').decode();if(epoch!==serial)return;$('detail').hidden=false;$('detailStatus').textContent=layers.length+' katman · özgün ürün oranları korunur';}catch(e){if(epoch===serial)$('detailStatus').textContent='Ürün katmanı yüklenemedi.'}}
function stop(){clearTimeout(timer);frame?.remove();frame=null}
function render(){stop();const epoch=++serial;const a=structuredClone(defaults[item.character]);if(mode==='single')a.items[item.slot]=item.id;if(mode==='full')for(const i of items.filter(x=>x.character===item.character))a.items[i.slot]=i.id;$('name').textContent=item.name;$('meta').textContent=(item.character==='gece'?'Gece':'Gölge')+' · '+item.rarity+' · '+item.price+' KC';$('products').value=item.id;const n=items.indexOf(item);$('position').textContent=(n+1)+' / '+items.length;$('prev').disabled=n===0;$('next').disabled=n===items.length-1;for(const k of ['single','full','base'])$(k).setAttribute('aria-pressed',String(k===mode));$('avatar').hidden=true;$('status').textContent='Karakter hazırlanıyor…';if(!q.has('embed'))detail(item,epoch);const f=document.createElement('iframe');frame=f;f.className='worker';f.title='Karakter çizim motoru';f.tabIndex=-1;f.setAttribute('aria-hidden','true');timer=setTimeout(()=>{if(epoch===serial){$('status').textContent='Karakter önizlemesi zaman aşımına uğradı.';stop()}},25000);f.src='/avatar-portrait-'+item.character+'.html?v=neon-qa2';f.dataset.epoch=String(epoch);f._appearance=a;document.body.append(f);}
window.addEventListener('message',async e=>{const f=frame;if(!f||e.origin!==location.origin||e.source!==f.contentWindow)return;const epoch=Number(f.dataset.epoch);if(epoch!==serial)return;if(e.data?.type==='kp-avatar-ready'&&e.data.character===item.character){f.contentWindow.postMessage({type:'kp-avatar-render',id:epoch,appearance:f._appearance,full:true},location.origin);return}if(e.data?.type!=='kp-avatar-result'||e.data.id!==epoch)return;try{if(e.data.error||!e.data.full?.startsWith('data:image/png'))throw Error(e.data.detail||'Görsel yok');const avatar=$('avatar');avatar.src=e.data.full;await avatar.decode();if(epoch!==serial)return;avatar.hidden=false;$('status').textContent='';stop()}catch(e){if(epoch===serial){$('status').textContent='Karakter önizlemesi yüklenemedi: '+e.message;stop()}}});
function pick(i){if(!i)return;item=i;const url=new URL(location.href);url.searchParams.set('item',i.id);history.replaceState(null,'',url);render()}$('products').onchange=()=>pick(items.find(i=>i.id===$('products').value));$('prev').onclick=()=>pick(items[items.indexOf(item)-1]);$('next').onclick=()=>pick(items[items.indexOf(item)+1]);for(const k of ['single','full','base'])$(k).onclick=()=>{mode=k;render()};render()})();
</script></body></html>
