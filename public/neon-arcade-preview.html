<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Arcade · Karakter önizlemesi</title><style>body{margin:0;background:#181123;color:#f4eaff;font:16px system-ui,sans-serif}main{max-width:560px;margin:auto;padding:16px;text-align:center}img{display:block;margin:auto;width:min(100%,360px);height:auto;object-fit:contain}a{color:#d7baff}#worker{position:absolute;width:480px;height:660px;left:-10000px;top:0;border:0}body.embed main{padding:4px}body.embed #back,body.embed h1,body.embed #note{display:none}body.embed img{width:min(100%,240px)}</style><script src="/neon-arcade-art.js?v=1"></script></head><body><main><a id="back" href="/shop.html">← Mağazaya dön</a><h1 id="name">Neon Arcade</h1><p id="status" role="status">Karakter hazırlanıyor…</p><img id="avatar" hidden alt="Seçili ürün karakter üzerinde"><p id="note">Test önizlemesi. Hesabındaki kombin veya KC bakiyesi değişmez.</p></main><script>
(()=>{'use strict';const q=new URLSearchParams(location.search),$=id=>document.getElementById(id),item=window.KPNeonArt.items.find(x=>x.id===q.get('item'));if(q.has('embed'))document.body.classList.add('embed');if(!item){$('status').textContent='Ürün bulunamadı.';return}const defaults={"gece":{"character":"gece","items":{"av_hair":"gece_hair_double","av_eye":"gece_eye_original","av_brow":"gece_brow_original","av_expression":"gece_mouth_original","av_top":"gece_top_heart","av_bottom":"gece_bottom_cargo","av_shoes":"gece_shoe_classic","av_ear":null,"av_wrist":null},"hairColor":"original","eyeColor":"gold","expressionBrows":true},"golge":{"character":"golge","items":{"av_hair":"golge_hair_original","av_eye":"golge_eyes_original","av_brow":"golge_eyebrows_original","av_expression":"golge_expression_original","av_top":"golge_top_default","av_bottom":"golge_bottom_default","av_shoes":"golge_shoes_default","av_ear":null,"av_wrist":null,"av_neck":null,"av_glasses":null},"hairColor":"original","eyeColor":"gold","expressionBrows":true}};const appearance=structuredClone(defaults[item.character]);appearance.items[item.slot]=item.id;$('name').textContent=item.name;const f=document.createElement('iframe');f.id='worker';f.title='Karakter çizim motoru';f.tabIndex=-1;f.setAttribute('aria-hidden','true');const stop=()=>{clearTimeout(timer);window.removeEventListener('message',receive);f.remove()};const fail=()=>{$('status').textContent='Karakter önizlemesi yüklenemedi.';stop()};function receive(e){if(e.origin!==location.origin||e.source!==f.contentWindow)return;if(e.data?.type==='kp-avatar-ready'&&e.data.character===item.character){f.contentWindow.postMessage({type:'kp-avatar-render',id:1,appearance},location.origin)}else if(e.data?.type==='kp-avatar-result'&&e.data.id===1){if(e.data.error||typeof e.data.body!=='string'||!e.data.body.startsWith('data:image/')){fail();return}$('avatar').src=e.data.body;$('avatar').hidden=false;$('status').textContent='';stop()}}window.addEventListener('message',receive);const timer=setTimeout(fail,25000);f.src='/avatar-portrait-'+item.character+'.html?v=neon-qa1';document.body.append(f)})();
</script></body></html>
