(()=>{'use strict';const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('tr-TR').format(Number.isFinite(Number(n))?Number(n):0),el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x};const names={self:'Kendi profilin',friend:'Arkadaşın',incoming:'Gelen arkadaşlık isteği',outgoing:'Gönderilen arkadaşlık isteği',none:'KEKIP oyuncusu'},rarity={normal:'Normal',rare:'Nadir',epic:'Destansı',legendary:'Efsanevi',mythic:'Mitik'};function card(title,items){const a=el('article',undefined,'panel'),m=el('div',undefined,'metrics');a.append(el('h3',title));for(const [label,value] of items){const n=el('div',undefined,'metric');n.append(el('b',value),el('small',label));m.append(n)}a.append(m);return a}
async function load(){try{const user=new URLSearchParams(location.search).get('user');if(user!==null&&!/^[a-z0-9_]{3,24}$/.test(user))throw Error('Geçersiz oyuncu adı.');const r=await fetch('/api/account/profile-view',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(user===null?{}:{username:user})});const d=await r.json();if(!r.ok)throw Error(d.error||'Profil açılamadı.');if(!/^[a-z0-9_]{3,24}$/.test(d.username))throw Error('Profil bilgileri geçersiz.');$('username').textContent='@'+d.username;$('title').textContent=d.title;$('relationship').textContent=names[d.relationship]||names.none;$('bio').textContent=d.bio||'Henüz biyografi eklenmedi.';$('hero').dataset.cover=d.cover;$('level').textContent='Seviye '+fmt(d.progress.level);$('xp').textContent=fmt(d.progress.xp)+' XP';const progress=Math.min(100,Math.max(0,Number(d.progress.percent)||0));$('fill').style.width=progress+'%';$('meter').setAttribute('aria-valuenow',String(progress));$('portrait').textContent=d.username.slice(0,2).toUpperCase();$('portrait').dataset.kpAvatar=d.username;if(d.relationship==='self'){$('action').href='/';$('action').textContent='Ana sayfada profilini düzenle ↗'}else{$('action').href='/friends.html';$('action').textContent=d.relationship==='friend'?'Arkadaşlarına dön ↗':'Arkadaşlık işlemleri ↗'}const b=d.battle,f=d.football;$('games').replaceChildren(card('Amiral Battı',[['Maç',fmt(b.games)],['Galibiyet',fmt(b.wins)],['İsabet',b.shots?Math.round(b.hits/b.shots*100)+'%':'—']]),card('Futbol Kariyer',[['Maç',fmt(f.games)],['Gol',fmt(f.goals)],['Asist',fmt(f.assists)]]));$('badgeCount').textContent=fmt(d.achievementCount)+' / '+fmt(d.achievementTotal)+' başarım kazanıldı.';$('badges').replaceChildren(...d.featured.map(x=>{const n=el('div',undefined,'badge');n.append(el('span',x.icon),el('strong',x.name),el('small',rarity[x.rarity]||'Rozet'));return n}));if(!d.featured.length)$('badges').append(el('p','Henüz vitrinde roze
