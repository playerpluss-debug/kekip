const photoFor=i=>i.character==='golge'?(golgePhotos[i.id]||i.thumbnail):i.thumbnail;
const detailFor=i=>i.character==='gece'?(geceDetails[i.id]||i.thumbnail):i.thumbnail;
function productImage(src,alt){const img=make('img');img.src=src;img.alt=alt;img.loading='lazy';img.decoding='async';return img;}
function purchaseButton(i,collection){const canBuy=canPurchase(i,collection);const b=make('button',!canBuy?'Satış kapalı':state.balance<i.price?'Yetersiz KC':'Satın al','primary');b.type='button';b.disabled=busy||!canBuy||state.balance<i.price;b.onclick=()=>{if($('tryDialog').open)$('tryDialog').close();buyGece(i)};return b;}
function showTry(i){if(!state)return;const collection=state[i.character+'Collection'];const pic=make('div',undefined,'dialog-avatar');pic.append(productImage(photoFor(i),i.name+' karakter üzerinde'));const info=make('div',undefined,'dialog-info');const rarity=make('div',i.rarity||'Standart','rarity');rarity.style.color=rarityColors[i.rarity]||'#c8c2d0';info.append(rarity,make('h3',i.name),make('div',i.starter?'Ücretsiz':hasItem(i)?'Gardırobunda':canPurchase(i,collection)?fmt(i.price):'Satış kapalı','price'),make('p','Görselde seçili ürün başlangıç kombini üzerinde gösterilmektedir. Diğer parçalar satışa dahil değildir.'));const live=make('a','Canlı olarak dene','btn');live.href=i.previewPath;info.append(live);if(hasItem(i)){const wardrobe=make('a','Gardırobum','btn primary');wardrobe.href='/'+i.character+'-gardirop.html';info.append(wardrobe)}else{info.append(purchaseButton(i,collection))}info.append(make('p','Ön izleme ücretsizdir. KC harcanmaz ve hesabındaki kombin değişmez.','dialog-note'));$('tryContent').replaceChildren(pic,info);if(!$('tryDialog').open)$('tryDialog').showModal();}
$('closeTry').onclick=()=>$('tryDialog').close();$('tryDialog').addEventListener('click',e=>{if(e.target===$('tryDialog'))$('tryDialog').close()});$('itemSearch').addEventListener('input',e=>{searchText=e.target.value.trim().toLocaleLowerCase('tr-TR');if(state&&['gece','golge'].includes(section))renderGece($('tabs'));});
function renderGece(sub){
 const golge=section==='golge', label=golge?'Gölge':'Gece', groups=golge?[...geceGroups,['av_glasses','Gözlük'],['av_neck','Kolye']]:geceGroups, path='/'+section+'-gardirop.html';const collection=state[section+'Collection'],items=collection?.items||[];
 const matches=(i,id)=>id==='all'||(id==='mine'?hasItem(i):i.slot===id);
 if(!['all','mine',...groups.map(g=>g[0])].includes(filter))filter='all';
 sub.replaceChildren(...[['all','Tümü'],['mine','Sahip olduklarım'],...groups].map(([id,label])=>{const b=make('button',label);b.type='button';b.setAttribute('aria-pressed',String(filter===id));b.onclick=()=>{filter=id;render()};return b}));
 const shown=items.filter(i=>matches(i,filter)&&(!searchText||i.name.toLocaleLowerCase('tr-TR').includes(searchText)));$('heading').textContent=label+' / '+(filter==='mine'?'Gardırobumdaki ürünler':groups.find(g=>g[0]===filter)?.[1]||'Tüm koleksiyon');
 $('collectionNote').textContent=shown.length+' ürün';
 $('grid').replaceChildren(...shown.map(i=>{const c=make('article',undefined,'card modular-card');const visual=make('button',undefined,'product-visual');visual.type='button';visual.setAttribute('aria-label',i.name+' — karakter üzerinde incele');visual.onclick=()=>showTry(i);
 const left=make('span',undefined,'product-shot'),right=make('span',undefined,'product-shot avatar-shot');left.append(productImage(detailFor(i),i.name+' ürün detayı'));right.append(productImage(photoFor(i),i.name+' karakter üzerinde'));visual.append(left,right);
 const kicker=make('div',undefined,'item-kicker');const rarity=make('span',i.rarity||'Standart','rarity');rarity.style.color=rarityColors[i.rarity]||'#c8c2d0';kicker.append(rarity);
 const foot=make('div',undefined,'product-foot');foot.append(make('div',i.starter?'Ücretsiz':hasItem(i)?'✓ Gardırobunda':canPurchase(i,collection)?fmt(i.price):'Satış kapalı',hasItem(i)?'owned':'price'));
 const actions=make('div',undefined,'product-actions'),tryBtn=make('button','Dene','try-btn');tryBtn.type='button';tryBtn.onclick=()=>showTry(i);actions.append(tryBtn);if(hasItem(i)){const g=make('a','Gardırobum','btn primary');g.href=path;actions.append(g)}else actions.append(purchaseButton(i,collection));
 c.append(visual,make('h3',i.name),kicker,foot,actions);return c}));
 if(!shown.length)$('grid').append(make('p','Aramana uygun ürün bulunamadı.','empty'));
}
async function buyGece(i){if(busy||!state||!state[i.character+'Collection']?.saleEnabled||i.starter||state.owned.includes(i.id))return;if(!confirm(i.name+' için '+fmt(i.price)+' harcamak istiyor musun?'))return;
 const username=state.username;busy=true;render();try{await api('shop-buy',{id:i.id,username,expectedPrice:i.price});notice('Ürün gardırobuna eklendi: '+i.name);}catch(e){notice(e.message,true);}finally{try{state=await api('shop');}catch(e){state=null;$('grid').replaceChildren();$('shopNav').hidden=true;$('balance').textContent='— KC';notice('Mağazayı yenile: '+e.message,true);}busy=false;$('refresh').disabled=false;render();}}
async function load(){if(busy)return;busy=true;render();try{state=await api('shop');notice('')}catch(e){state=null;$('grid').replaceChildren();$('shopNav').hidden=true;$('collectionNote').textContent='';$('balance').textContent='— KC';notice(e.status===401?'Mağazayı kullanmak için ana sayfadan giriş yap.':e.message,true)}finally{busy=false;$('refresh').disabled=false;render()}}
async function act(i,owned,equipped){if(busy)return;if(!owned&&i.slot.startsWith('av_')){notice('Eski karakter ürünleri artık satışta değil.',true);return;}if(!owned&&!confirm(i.name+' için '+fmt(i.price)+' harcamak istiyor musun?'))return;busy=true;render();try{await api(owned?'shop-equip':'shop-buy',owned?{slot:i.slot,id:equipped?'':i.id,username:state.username}:{id:i.id,username:state.username});notice(equipped?'Kozmetik çıkarıldı.':owned?'Kozmetik kuşanıldı.':'Ürün envanterine eklendi.');}catch(e){notice(e.message,true)}finally{try{state=await api('shop')}catch(e){state=null;$('grid').replaceChildren();$('shopNav').hidden=true;$('collectionNote').textContent='';$('balance').textContent='— KC';notice('Mağazayı yenile: '+e.message,true)}busy=false;$('refresh').disabled=false;render()}}
$('refresh').onclick=load;window.addEventListener('focus',load);load()})();
</script><script src="/social.js?v=41" defer></script><script src="/chat-client.js?v=47" defer></script></body></html>
