  <style>
    .ring { transform-origin: 240px 275px; animation: spin 22s linear infinite; }
    .reverse { animation-duration: 35s; animation-direction: reverse; }
    .core { transform-origin: 240px 275px; animation: pulse 5.5s ease-in-out infinite; }
    .currents { animation: travel 12s linear infinite; }
    .sparks { animation: gather 6s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(.93); opacity: .63; } 51% { transform: scale(1.1); opacity: 1; } }
    @keyframes travel { to { stroke-dashoffset: -192; } }
    @keyframes gather { 0%,100% { opacity: .46; transform: translateY(13px); } 50% { opacity: .96; transform: translateY(-21px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
