    .corona { transform-origin: 240px 194px; animation: breathe 7s ease-in-out infinite; }
    .rays { transform-origin: 240px 194px; animation: orbit 27s linear infinite; }
    .ash { animation: lift 7s linear infinite; }
    .far { animation-duration: 11s; animation-delay: -5s; }
    .lava { animation: magma 4s ease-in-out infinite alternate; }
    @keyframes breathe { 0%,100% { transform: scale(.96); opacity: .67; } 48% { transform: scale(1.16); opacity: 1; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes lift { 0% { transform: translate(-22px,70px); opacity: 0; } 20%,72% { opacity: .85; } 100% { transform: translate(42px,-238px); opacity: 0; } }
    @keyframes magma { from { opacity: .47; } to { opacity: .94; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
