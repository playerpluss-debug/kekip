<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 660">
  <style>

    .glints, .reflection { transform-box: fill-box; transform-origin: center; }
    .reflection { animation: reflection-shift 4.4s ease-in-out infinite; }
    .glints { animation: glint-shift 3.6s ease-in-out -1s infinite; }
    .wave { animation: swell 6.2s linear infinite; }
    .foreground { animation: swell 4.8s linear -2s infinite reverse; }
    @keyframes reflection-shift {
      0%, 100% { opacity: .58; transform: translate(-16px, -3px) scaleX(.77); }
      46% { opacity: 1; transform: translate(18px, 7px) scaleX(1.22); }
      74% { opacity: .79; transform: translate(-3px, 2px) scaleX(.97); }
    }
    @keyframes glint-shift {
      0%, 100% { opacity: .25; transform: translate(10px, 0) scaleX(.76); }
      50% { opacity: .85; transform: translate(-14px, 9px) scaleX(1.13); }
    }
    @keyframes swell { to { transform: translateX(-144px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
