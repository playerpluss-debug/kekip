<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 660">
  <style>

    .curtain, .echo { transform-box: fill-box; transform-origin: center; }
    .curtain { animation: curtain-sway 6s ease-in-out infinite; }
    .echo { animation: echo-sway 8s ease-in-out -2s infinite; }
    .threads { animation: thread-light 5s ease-in-out -1s infinite; }
    @keyframes curtain-sway {
      0%, 100% { transform: translate(-32px, -24px) skewX(-8deg) scale(1.15, .83); }
      46% { transform: translate(26px, 35px) skewX(10deg) scale(1.17, 1.28); }
      72% { transform: translate(9px, 7px) skewX(2deg) scale(1.13, 1.05); }
    }
    @keyframes echo-sway {
      0%, 100% { transform: translate(28px, 19px) skewX(7deg) scale(1.1, 1.08); opacity: .36; }
      50% { transform: translate(-32px, -13px) skewX(-10deg) scale(1.17, 1.3); opacity: .8; }
    }
    @keyframes thread-light {
      0%, 100% { opacity: .33; }
      45% { opacity: .85; }
      70% { opacity: .5; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#090f27"/><stop offset=".65" stop-color="#173551"/><stop offset="1" stop-color="#101626"/></linearGradient>
    <linearGradient id="light" x2="0" y2="1"><stop stop-color="#74f7d5" stop-opacity="0"/><stop offset=".55" stop-color="#6ff4d9" stop-opacity=".55"/><stop offset="1" stop-color="#8b76ff" stop-opacity=".08"/></linearGradient>
    <linearGradient id="violet" x2="0" y2="1"><stop stop-color="#8372ff" stop-opacity="0"/><stop offset=".63" stop-color="#ac8bff" stop-opacity=".54"/><stop offset="1" stop-color="#5eddfa" stop-opacity=".12"/></linearGradient>
  </defs>
  <path fill="url(#sky)" d="M0 0h480v660H0z"/>
  <path fill="#b9f4fc" opacity=".72" d="M35 96h2v2h-2zM89 54h3v3h-3zM155 113h2v2h-2zM202 50h2v2h-2zM284 94h3v3h-3zM337 49h2v2h-2zM389 129h3v3h-3zM440 74h2v2h-2z"/>
  <g class="curtain">
    <path fill="url(#light)" d="M-70 98Q44 196 158 111T388 106T526 91L526 181Q443 257 351 176T142 203T-70 201Z"/>
    <path class="threads" fill="none" stroke="#9cf7e2" stroke-width="2" opacity=".46" d="M-70 156Q45 230 155 154T371 147T526 131M-70 172Q45 246 155 170T371 163T526 147"/>
  </g>
  <g class="echo" opacity=".55"><path fill="url(#violet)" d="M-90 187Q36 276 178 190T384 188T540 159V253Q460 314 370 247T150 280T-90 268Z"/></g>
  <path fill="#21384e" d="M0 456l73-89 26 24 61-61 68 89 62-45 20 21 63-85 107 118v232H0Z"/>
  <path fill="#111d30" d="M0 482l71-59 54 28 63 65 59-35 87 14 71-73 75 44v194H0Z"/>
  <path fill="#0b1423" d="M0 574Q98 539 196 574T480 559v101H0Z"/>
</svg>
