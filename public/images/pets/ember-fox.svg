<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Kor Tilkisi</title>
  <style>
    .shadow{transform-origin:100px 172px;animation:shadow 3.8s ease-in-out infinite}
    .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 2.7s ease-in-out infinite alternate}
    .spark:nth-of-type(2n){animation-delay:-1.3s}
    @keyframes shadow{50%{transform:scaleX(.83);opacity:.42}}
    @keyframes twinkle{0%{opacity:.25;transform:scale(.65)}100%{opacity:.95;transform:scale(1.15)}}
    .fox{transform-origin:93px 160px;animation:breathe 4.2s ease-in-out infinite}
    .flame{transform-origin:133px 144px;animation:flicker 2.5s ease-in-out infinite alternate}
    .embers{animation:rise 3.3s linear infinite}
    .slow{animation-delay:-1.7s}
    @keyframes breathe{50%{transform:translateY(-3px)}}
    @keyframes flicker{0%{transform:rotate(-9deg) scale(.94,1.03)}100%{transform:rotate(10deg) scale(1.03,1.12)}}
    @keyframes rise{0%{transform:translateY(16px);opacity:0}22%,66%{opacity:1}100%{transform:translate(10px,-29px);opacity:0}}
    @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
  </style>
  <defs>
    <linearGradient id="fur" x2="1" y2="1"><stop stop-color="#ffc780"/><stop offset="1" stop-color="#db674a"/></linearGradient>
    <linearGradient id="shade" x2="0" y2="1"><stop stop-color="#db674a"/><stop offset="1" stop-color="#652c46"/></linearGradient>
    <linearGradient id="light" x2="1" y2="1"><stop stop-color="#fff0ce"/><stop offset="1" stop-color="#ff7659"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#ff7659" stop-opacity=".35"/><stop offset="1" stop-color="#ff7659" stop-opacity="0"/></radialGradient>
    <path id="star" d="M0-7 2-2 7 0 2 2 0 7-2 2-7 0-2-2Z"/>

  </defs>
  <ellipse cx="100" cy="116" rx="89" ry="72" fill="url(#aura)"/>
  <ellipse class="shadow" cx="100" cy="172" rx="53" ry="9" fill="#110e27" opacity=".68"/>
  <g class="flame" stroke="#602941" stroke-width="3" stroke-linejoin="round">
    <path d="M111 152q5-22 30-37 16-10 11-37 29 18 28 42 0 41-44 44-14 1-25-12Z" fill="url(#shade)"/>
    <path d="M129 155q5-19 25-31 15-9 12-24 19 21 7 43-9 17-33 19Z" fill="url(#fur)" stroke="none"/>
    <path d="M154 143q11-10 14-21 6 15-9 26Z" fill="#fff0b3" stroke="none"/>
  </g>
  <g fill="#ffd295"><g class="embers"><circle cx="169" cy="72" r="3"/><circle cx="153" cy="62" r="2"/><circle cx="149" cy="83" r="2"/></g><g class="embers slow"><circle cx="177" cy="103" r="2.4"/><circle cx="156" cy="94" r="2.7"/><circle cx="183" cy="81" r="1.8"/></g></g>
  <g class="fox" stroke="#612f43" stroke-width="3" stroke-linejoin="round">
    <path d="M65 125q9-20 33-17 35 5 35 40-3 16-20 17H77q-21-3-12-40Z" fill="url(#shade)"/>
    <path d="M83 124q17-9 32 10l2 21q-21 6-41-1Z" fill="#ffe5bd" stroke="none"/>
    <path d="M60 156q8-11 21-10 12 0 12 9 0 10-17 10-14 0-16-9Zm35 0q8-11 21-10 12 0 12 9 0 10-17 10-14 0-16-9Z" fill="url(#fur)"/>
    <path d="M55 95q-11-15-8-47 15 1 35 22 13-4 24 2 12-21 32-25 7 28-6 48 7 5 14 17-12 22-46 25-29 1-50-18 8-8 5-24Z" fill="url(#fur)"/>
    <path d="M52 57q10 4 20 17l-13 8Zm80 1-16 17 12 7Z" fill="#ff9eab" stroke="none"/>
    <path d="M52 116q17-23 45-1 26-19 47-5-7 23-44 27-29 1-48-19Z" fill="#fff0d1" stroke="none"/>
    <path d="M69 101q7-7 16 1m25-1q7-7 15 0" fill="none" stroke="#472638" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M95 114q5-3 10 0l-5 5Z" fill="#492a3b" stroke="none"/><path d="M94 123q4 1 6-4 2 5 8 3" fill="none" stroke-width="1.7"/>
    <path d="M93 77l6-7 6 7-6 12Z" fill="#fff0af" stroke="none"/>
  </g>
</svg>
